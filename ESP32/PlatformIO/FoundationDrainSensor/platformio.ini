; DrainSensor – ESP32-WROOM-32D – LoRaWAN foundation drain sensor
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
monitor_speed = 115200
upload_speed  = 460800

; Minimal SPIFFS: 1.9 MB app + OTA + 128 KB SPIFFS
board_build.partitions = min_spiffs.csv

lib_deps =
    jgromes/RadioLib @ ^6.6.0
