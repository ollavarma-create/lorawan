[env:esp32dev]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_filters = direct    ; Poistaa suodattimet, jotka voivat piilottaa outputia
monitor_rts = 0             ; Estää RTS-signaalin häiriöt
monitor_dtr = 0             ; Estää DTR-signaalin häiriöt
# ESP32-C3 USB-CDC asetukset (TÄRKEÄ!)
build_flags =
  -D CORE_DEBUG_LEVEL=4 ; vaihda 0 tuotannossa
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    jgromes/RadioLib@^7.3.0
    ArduinoOTA

    